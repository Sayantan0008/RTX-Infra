<svg width="240" height="80" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b689;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4c699;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="240" height="80" rx="12" fill="url(#bgGradient)" stroke="url(#goldGradient)" stroke-width="1.5"/>
  
  <!-- RTX Text - Modern, bold typography -->
  <text x="25" y="32" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="url(#goldGradient)" filter="url(#glow)">RTX</text>
  
  <!-- Infrastructure Text - Smaller, elegant -->
  <text x="25" y="52" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="url(#goldGradient)" letter-spacing="1.5">INFRASTRUCTURE</text>
  
  <!-- Architectural Elements - Right side -->
  <g transform="translate(160, 20)">
    <!-- Main Building Structure -->
    <rect x="0" y="25" width="25" height="30" fill="url(#goldGradient)" rx="2"/>
    
    <!-- Building Windows -->
    <rect x="3" y="30" width="5" height="5" fill="#1a1a1a" rx="1"/>
    <rect x="17" y="30" width="5" height="5" fill="#1a1a1a" rx="1"/>
    <rect x="3" y="38" width="5" height="5" fill="#1a1a1a" rx="1"/>
    <rect x="17" y="38" width="5" height="5" fill="#1a1a1a" rx="1"/>
    
    <!-- Building Door -->
    <rect x="10" y="42" width="5" height="13" fill="#1a1a1a" rx="1"/>
    
    <!-- Building Top/Roof -->
    <polygon points="0,25 12.5,15 25,25" fill="url(#goldGradient)"/>
    
    <!-- Antenna/Communication Tower -->
    <line x1="12.5" y1="15" x2="12.5" y2="8" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12.5" cy="8" r="2" fill="url(#goldGradient)"/>
    
    <!-- Decorative Elements -->
    <circle cx="5" cy="45" r="1" fill="#1a1a1a"/>
    <circle cx="20" cy="45" r="1" fill="#1a1a1a"/>
  </g>
  
  <!-- Decorative Line under text -->
  <line x1="25" y1="60" x2="150" y2="60" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Small architectural icons -->
  <g transform="translate(180, 15)">
    <!-- Crane/Construction element -->
    <line x1="0" y1="15" x2="0" y2="5" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="8" y2="5" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="5" x2="8" y2="15" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="4" cy="10" r="1.5" fill="url(#goldGradient)"/>
  </g>
  
  <!-- Year/Established -->
  <text x="200" y="70" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="url(#goldGradient)" text-anchor="end">EST. 2015</text>
</svg>
