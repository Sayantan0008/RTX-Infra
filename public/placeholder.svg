<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="360" height="260" rx="8" fill="white" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="40" y="40" width="320" height="40" fill="#c4b689"/>
  <text x="200" y="65" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">EXCELLENCE AWARD</text>
  
  <!-- Content -->
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">MAHARASHTRA GOVERNMENT</text>
  <text x="200" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c757d">Certificate of Recognition</text>
  
  <!-- Main Text -->
  <text x="200" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">This is to certify that</text>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c4b689">RTX Infrastructure</text>
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">has been recognized for excellence in</text>
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">architectural and interior design</text>
  
  <!-- Decorative Elements -->
  <circle cx="80" cy="80" r="3" fill="#c4b689"/>
  <circle cx="320" cy="80" r="3" fill="#c4b689"/>
  <circle cx="80" cy="240" r="3" fill="#c4b689"/>
  <circle cx="320" cy="240" r="3" fill="#c4b689"/>
  
  <!-- Bottom Text -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6c757d">For Designing Mumbai Public Library, Bandra</text>
</svg>